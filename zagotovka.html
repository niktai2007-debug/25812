<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Спокойные медитации</title>
    <style>
        body {
            background-image: url('https://images.unsplash.com/photo-1519741468941-3226d5158627?q=80&w=1000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            background-color: rgba(10, 10, 20, 0.7);

            color: #fbf9f4;
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 40px;
            line-height: 1.6;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            position: relative;
            z-index: 2;         }

        .p1 {
            color: #fff;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .p2 {
            color: #ffe4b5;
            font-size:18
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        p {
            margin-bottom: 15px;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px;
            }
            .p1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <p class="p1">Спокойствие.</p>
        <p class="p2">Расслабление</p>
        <p>Это место, где вы можете манифестировать на лучшую жизнь. Слушайте приятную музыку и думайте о своих мечтах.</p>
        <p>Пусть свет свечи напомнит: самое важное уже внутри вас.</p>
        <p>«Спокойствие находится внутри вас, не ищите его снаружи». — Будда</p>
        <p>Хорошего дня.</p>
    </div>
</body>
</html>
